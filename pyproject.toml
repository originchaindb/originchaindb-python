[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "originchain"
version = "1.0.0rc1"
description = "OriginChainDB Python client for SQL, full-text search, vector search, and graph queries."
readme = "README.md"
authors = [{ name = "Silicoyn Technologies", email = "support@originchain.ai" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "httpx>=0.27,<1",
  "h2>=4,<5",
  "typing-extensions>=4.7",
]

[project.optional-dependencies]
async = []  # async client uses httpx directly; no extras required.
# Back-compat alias - the 0.3.x `[http2]` extra is now a no-op since h2
# is a hard dep. Kept so `pip install originchain[http2]` doesn't break
# existing requirements files / CI pins.
http2 = []
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage      = "https://originchain.ai"
Documentation = "https://originchain.ai/docs"
Source        = "https://github.com/originchaindb/originchaindb-python"
Issues        = "https://github.com/originchaindb/originchaindb-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["originchain"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the original SDK CI rule set explicit as Ruff's defaults evolve.
# New formatting/type-modernization rules require their own reviewed migration.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Deliberate mid-file imports: client.py imports _namespaces after the
# class definitions it depends on (circular-import avoidance); the
# tests import late after test-local setup.
"originchain/client.py" = ["E402"]
"tests/test_graph.py" = ["E402"]
"tests/test_sql.py" = ["E402"]
"tests/test_vector.py" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
