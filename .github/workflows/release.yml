name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed on main (X.Y.Z or X.Y.ZrcN)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate source, version and unused tag
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release_gate.py

  compatibility:
    needs: gate
    uses: ./.github/workflows/ci.yml

  live:
    needs: [gate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: dist
      - name: Install the exact release wheel into a fresh consumer
        run: |
          python scripts/verify_package.py
          python -m venv "$RUNNER_TEMP/python-live-consumer"
          "$RUNNER_TEMP/python-live-consumer/bin/python" -m pip install dist/*.whl
      - name: Verify the installed wheel against the supported test database
        env:
          OC_REQUIRE_LIVE: "1"
          OC_BASE: ${{ secrets.OC_BASE }}
          OC_BEARER: ${{ secrets.OC_BEARER }}
          OC_TENANT: ${{ secrets.OC_TENANT }}
          OC_DB_USER: ${{ secrets.OC_DB_USER }}
          OC_DB_KEY: ${{ secrets.OC_DB_KEY }}
          OC_NS: py_release_${{ github.run_id }}
        run: |
          "$RUNNER_TEMP/python-live-consumer/bin/python" -I tests/e2e_smoke.py
          "$RUNNER_TEMP/python-live-consumer/bin/python" -I scripts/verify_query_metrics_live.py
          "$RUNNER_TEMP/python-live-consumer/bin/python" -I scripts/verify_sql_delete_live.py
          "$RUNNER_TEMP/python-live-consumer/bin/python" -I scripts/verify_sql_values_live.py

  package:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [gate, compatibility, live, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: dist
      - name: Select configured publishing authentication
        id: auth
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then echo "token=true" >> "$GITHUB_OUTPUT"; else echo "token=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish with configured project token
        if: steps.auth.outputs.token == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish with configured trusted publisher
        if: steps.auth.outputs.token != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify fresh registry installation matches the accepted wheel
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python -m pip download --only-binary :all: --no-deps --index-url https://pypi.org/simple --dest registry-dist "originchain==$RELEASE_VERSION"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          built = list(Path('dist').glob('*.whl'))
          fetched = list(Path('registry-dist').glob('*.whl'))
          assert len(built) == len(fetched) == 1
          assert built[0].name == fetched[0].name
          assert hashlib.sha256(built[0].read_bytes()).digest() == hashlib.sha256(fetched[0].read_bytes()).digest(), 'Registry wheel differs from accepted bytes'
          PY
          python scripts/verify_package.py registry-dist/*.whl
      # Originchain-ops records the release from this artifact after publication.
      # The workflow token is never used to create tags or GitHub releases.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-python-package
          path: dist/*
          if-no-files-found: error
