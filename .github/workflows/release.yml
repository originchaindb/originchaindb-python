name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable SDK version already committed on main (X.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate source, version and unused tag
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release_gate.py

  compatibility:
    needs: gate
    uses: ./.github/workflows/ci.yml

  live:
    needs: gate
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  package:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [gate, compatibility, live, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: dist
      - name: Select configured publishing authentication
        id: auth
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$PYPI_API_TOKEN" ]; then echo "token=true" >> "$GITHUB_OUTPUT"; else echo "token=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish with configured project token
        if: steps.auth.outputs.token == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish with configured trusted publisher
        if: steps.auth.outputs.token != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      - name: Record release and source tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: gh release create "v$RELEASE_VERSION" dist/* --target "$GITHUB_SHA" --title "Python SDK $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
