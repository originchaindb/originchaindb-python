name: e2e

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      # Run only when approved nonproduction test credentials are configured as
      # the repository secrets OC_URL (the test database's address, from
      # Connect) and OC_TOKEN (an access token for it). The query metrics step
      # needs a token with query-administrator access.
      - run: python tests/e2e_smoke.py
        env:
          OC_REQUIRE_LIVE: "1"
          OC_URL: ${{ secrets.OC_URL }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
          OC_NS: py_ci_${{ github.run_id }}

      - name: Query metrics (sync and async, read-only)
        run: python scripts/verify_query_metrics_live.py
        env:
          OC_URL: ${{ secrets.OC_URL }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}

      - name: Bulk DELETE results (sync and async, isolated fixtures)
        run: python scripts/verify_sql_delete_live.py
        env:
          OC_URL: ${{ secrets.OC_URL }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}

      - name: SQL values and projection compatibility (sync and async)
        run: python scripts/verify_sql_values_live.py
        env:
          OC_URL: ${{ secrets.OC_URL }}
          OC_TOKEN: ${{ secrets.OC_TOKEN }}
