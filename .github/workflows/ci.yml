name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: "3.10"
          - os: ubuntu-latest
            runtime: "3.12"
          - os: ubuntu-latest
            runtime: "3.14"
          - os: windows-latest
            runtime: "3.12"
          - os: macos-latest
            runtime: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.runtime }}
      - name: Check out the shared API v1 contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: originchaindb/.github
          ref: a47804a80fc5b31022d241dc814d905f6f78e723
          path: .contract-reference
          persist-credentials: false
      - name: Verify cross-language contract
        run: python scripts/check_contract.py
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest tests -q
      - name: HTTP contract
        run: python tests/contract/run.py -- python tests/consumer.py
      - name: Resilience contract
        run: python tests/contract/resilience.py -- python tests/resilience.py
      - name: Check example syntax
        run: python -m py_compile examples/catalog.py
      - name: Build
        run: python -m build
      - name: Fresh package installation
        run: python scripts/verify_package.py
      - name: Type check public SDK
        run: mypy originchain
      - name: Check application integration example
        run: python -m py_compile examples/integration.py
